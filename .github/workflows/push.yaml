name: Push Docker image and deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the Docker image (e.g., user)'
        required: true
        type: string
      registry:
        description: 'The container registry to push to'
        required: false
        type: string
        default: 'ghcr.io/portfolio-solver-platform'
      main_branch_name:
        description: 'The branch name that receives the latest tag'
        required: false
        type: string
        default: 'main'
    secrets:
      repo_bot_private_key:
        description: 'Private key for the repo bot'
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE_NAME: ${{ inputs.image_name }}
      MAIN_BRANCH_NAME: ${{ inputs.main_branch_name }}

    steps:
      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF_NAME//\//-}
          sha=${GITHUB_SHA::8}
          ts=$(date +'%Y%m%d%H%M%S')
          echo "BUILD_TAG=${branch}-${sha}-${ts}" >> "$GITHUB_ENV"

      - name: Generate Tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }}"
          TAGS="$IMAGE"

          if [ "$GITHUB_REF_NAME" == "${{ env.MAIN_BRANCH_NAME }}" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "Building from main branch. 'latest' tag will be applied."
          fi

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "DOCKER_TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  trigger-update:
    needs: push 
    uses: Portfolio-Solver-Platform/infrastructure/.github/workflows/update.yaml@main
    secrets:
      repo_bot_private_key: ${{ secrets.repo_bot_private_key }}
