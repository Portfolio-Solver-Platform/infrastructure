name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@629b284231c2a82554b724e357e47fc6020833c8 # v3.21.2

      - name: Install environment
        run: nix develop .#ci

      - name: Run checks
        run: nix develop .#ci --command pre-commit run -a

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check dependency status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Failing: One or more upstream jobs failed, were cancelled, or skipped."
          exit 1

      - name: Mark as successful
        run: echo "All required jobs have passed!"
