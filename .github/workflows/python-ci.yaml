name: CI
on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the Docker image (e.g., user)'
        required: false
        type: string
        default: "local-ci"
      image_tag:
        description: 'The image tag'
        required: false
        type: string
      code_audit_targets:
        description: 'Folders or files to scan with Bandit (space-separated)'
        required: false
        type: string
        default: "."

permissions:
  contents: read

env:
  CI_IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag || github.sha }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dev
          tags: ${{ env.CI_IMAGE }}
          load: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Lint
        run: docker run --rm "$CI_IMAGE" ruff check . --no-cache

      - name: Test
        run: docker run --rm "$CI_IMAGE" pytest -q -p no:cacheprovider

      - name: Audit code
        run: docker run --rm "$CI_IMAGE" bandit ${{ inputs.code_audit_targets }} -qrx ./tests

      - name: Dependency audit
        run: docker run --rm "$CI_IMAGE" pip-audit  --ignore-vuln GHSA-48p4-8xcf-vxj5 --ignore-vuln GHSA-pq67-6m6q-mj2v --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-25645 --ignore-vuln CVE-2026-3219

      - name: Cache Trivy DB
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-db
          restore-keys: ${{ runner.os }}-trivy-

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          vuln-type: "os,library"
          ignore-unfixed: true
          cache-dir: .trivycache
          skip-files: "**/google/auth/crypt/__pycache__/**"
